<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameDev PP — анализ игрового рынка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .genre-checkbox { margin-bottom: 0.5rem; }
        .card-img-top { height: 200px; object-fit: cover; }
    </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="{% url 'home' %}">
        <i class="bi bi-graph-up"></i> GameDev PP
      </a>

      {% if user.is_authenticated %}
        <div class="d-flex align-items-center">
          <span class="navbar-text text-white me-3">Привет, {{ user.username }}!</span>
          <a class="btn btn-outline-light" href="{% url 'logout' %}">Выйти</a>
        </div>
      {% else %}
        <a class="btn btn-outline-light" href="{% url 'login' %}">Войти</a>
      {% endif %}
    </div>
  </nav>

  <div class="container">
    {% block content %}
    {% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
